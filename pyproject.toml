[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-nexus"
version = "0.1.0"
description = "AgentNexus: Autonomous multi-agent orchestration engine with zero-trust audit and Git worktree isolation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.8",
  "networkx>=3.3",
  "PyYAML>=6.0",
]

[project.scripts]
nexus = "orch.cli.main:app"
agentnexus = "orch.cli.main:app"
orch = "orch.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["orch"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.11", "ruff>=0.6", "build>=1.2"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 120
